name: Bug report
description: Report a reproducible application problem without private recordings or indexes.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Do not post real .pb files, recordings, full path reports, Steam IDs or secrets."
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: 1.3.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and .NET Framework versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Prefer synthetic filenames and redacted error messages.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal paths, identifiers, credentials and real index/recording data.
          required: true
